  <title id="title">Muscle-invasive bladder tumor, tertiary lymphoid structure, and viral vectors</title>
  <desc id="description">A conceptual bladder-wall section shows a pink tumor extending from the lining through connective tissue into the purple muscle layer. A nearby tertiary lymphoid structure contains separate B-cell and T-cell groups. Cyan viral-vector symbols are shown nearby. This is a schematic, not a treatment result or an anatomical scale drawing.</desc>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 560" fill="none" role="img" aria-labelledby="title description">
  <title id="title">Muscle-invasive bladder tumor, tertiary lymphoid structure, and viral vectors</title>
  <desc id="description">An outlined, enlarged bladder-wall section is shown separately from a small whole-bladder overview. The section shows a pink tumor extending from the lining through connective tissue into the purple muscle layer. A nearby tertiary lymphoid structure has a central B-cell follicle surrounded by a T-cell region. Cyan viral-vector symbols are shown nearby. This is a schematic, not a treatment result or an anatomical scale drawing.</desc>
